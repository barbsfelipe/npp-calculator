name: app-mobile tests

# Roda `npm test` (calc-parity.mjs + trial-gate.mjs + paywall.mjs) a cada
# push/PR que mexer em app-mobile — calc-parity.mjs é o único regression
# guard pras fórmulas clínicas deste repo, e ficou ~2 semanas quebrado
# sem ninguém notar antes de setembro/2026 por não rodar em lugar nenhum
# automatizado. paywall.mjs tinha uma asserção de preço desatualizada
# (esperava R$49,90/R$298,80; o app mostra R$9,90/R$79,90, os preços
# reais atuais) — corrigida antes deste workflow passar a rodar a
# suíte inteira.
#
# Deliberadamente NÃO roda tests/auth-flow.mjs (npm run test:auth): esse faz
# chamadas reais pro Supabase e cria uma conta de teste descartável a
# cada execução — não é o tipo de coisa que se quer automatizada num
# CI público. Ver app-mobile/README.md.

on:
  push:
    branches: [main]
    paths:
      - "app-mobile/**"
      - ".github/workflows/app-mobile-tests.yml"
  pull_request:
    paths:
      - "app-mobile/**"
      - ".github/workflows/app-mobile-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - run: npm ci

      # playwright-core (usado aqui, não o pacote "playwright" completo)
      # não baixa navegador nenhum sozinho — precisa desse passo explícito
      # antes de rodar os testes, que fazem chromium.launch().
      - run: npx playwright-core install --with-deps chromium

      - run: npm test
