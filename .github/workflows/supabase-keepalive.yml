name: Supabase keep-alive

# O plano gratuito do Supabase pausa o projeto depois de ~7 dias sem
# atividade — e aí o domínio <ref>.supabase.co some (NXDOMAIN) e o
# nppcalc.com.br inteiro quebra (login, compra, prescrições salvas: o
# navegador só mostra "Load failed"). Aconteceu em nov/2026.
#
# Este workflow faz uma consulta real ao banco (REST → Postgres) a cada
# 3 dias pra contar como atividade. Usa só a anon key pública que já está
# em app-web/config.js (RLS devolve [] pro anônimo — nenhum dado sai).
#
# Se falhar, o GitHub manda e-mail de "workflow failed": serve também de
# alarme de que o backend caiu. Lembrete: o GitHub desativa workflows
# agendados após 60 dias sem commits no repo — se isso acontecer, ele
# avisa por e-mail e basta reativar na aba Actions.

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app-web/config.js
          sparse-checkout-cone-mode: false

      - name: Query Supabase
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' app-web/config.js | head -1)
          KEY=$(grep -oE 'eyJ[A-Za-z0-9._-]+|sb_publishable_[A-Za-z0-9_-]+' app-web/config.js | head -1)
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              "$URL/rest/v1/npp_prescricoes_salvas?select=id&limit=1")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Supabase não respondeu 200 — projeto pode estar pausado. Abra supabase.com/dashboard e clique em Restore."
          exit 1
